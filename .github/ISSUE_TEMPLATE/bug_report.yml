name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: The command you ran and a minimal configuration. Remove private data and never paste tokens.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: DevTrace version
      description: Output of `devtrace --version`
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Node.js version and operating system
    validations:
      required: true
